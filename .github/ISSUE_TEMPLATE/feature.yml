name: Feature or change
description: Define one reviewable product or theme change.
title: "[Feature] "
labels:
  - feature
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What user or business outcome should this change create?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what is included and explicitly excluded.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable checks that determine whether the work is complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: surfaces
    attributes:
      label: Affected surfaces
      description: Pages, languages, devices, Shopify data, or integrations affected.
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: Risk and permissions
      description: Note production data, payments, credentials, legal assets, or approval gates.
    validations:
      required: true
